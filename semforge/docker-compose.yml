# @TASK P4-O1-T1 - Migration-first, least-privilege container orchestration example
# @SPEC docs/planning/06-tasks.md#p4-o1-t1--node-24-docker와-운영-도구
name: semforge

x-runtime: &runtime
  init: true
  networks: [backend]
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
    - /home/semforge/.cache:rw,noexec,nosuid,nodev,size=64m
    - /home/semforge/.config:rw,noexec,nosuid,nodev,size=16m

x-node-build: &node-build
  context: .
  args:
    NODE_BASE_IMAGE: ${SEMFORGE_NODE_BASE_IMAGE}

services:
  release:
    <<: *runtime
    image: ${SEMFORGE_MIGRATOR_IMAGE:-semforge-migrator:local}
    build:
      <<: *node-build
      target: migrator
    env_file:
      - path: ${SEMFORGE_MIGRATION_ENV_FILE:-deploy/env/migration.env}
        required: true
    environment:
      SEMFORGE_SERVICE: migrate
    restart: "no"

  web:
    <<: *runtime
    image: ${SEMFORGE_WEB_IMAGE:-semforge-web:local}
    build:
      <<: *node-build
      target: web
    env_file:
      - path: ${SEMFORGE_WEB_ENV_FILE:-deploy/env/web.env}
        required: true
    environment:
      SEMFORGE_SERVICE: web
    depends_on:
      release:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${SEMFORGE_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  worker:
    <<: *runtime
    image: ${SEMFORGE_WORKER_IMAGE:-semforge-worker:local}
    build:
      <<: *node-build
      target: worker
    env_file:
      - path: ${SEMFORGE_WORKER_ENV_FILE:-deploy/env/worker.env}
        required: true
    environment:
      SEMFORGE_SERVICE: worker
    depends_on:
      release:
        condition: service_completed_successfully
    stop_grace_period: 45s
    restart: unless-stopped

  relay:
    <<: *runtime
    image: ${SEMFORGE_RELAY_IMAGE:-semforge-relay:local}
    build:
      <<: *node-build
      target: relay
    env_file:
      - path: ${SEMFORGE_RELAY_ENV_FILE:-deploy/env/relay.env}
        required: true
    environment:
      SEMFORGE_SERVICE: relay
    depends_on:
      release:
        condition: service_completed_successfully
    stop_grace_period: 45s
    restart: unless-stopped

  scheduler:
    <<: *runtime
    profiles: [scheduled]
    image: ${SEMFORGE_SCHEDULER_IMAGE:-semforge-scheduler:local}
    build:
      <<: *node-build
      target: scheduler
    env_file:
      - path: ${SEMFORGE_SCHEDULER_ENV_FILE:-deploy/env/scheduler.env}
        required: true
    environment:
      SEMFORGE_SERVICE: scheduler
    depends_on:
      release:
        condition: service_completed_successfully
    restart: "no"

  report-scheduler:
    <<: *runtime
    profiles: [scheduled]
    image: ${SEMFORGE_SCHEDULER_IMAGE:-semforge-scheduler:local}
    build:
      <<: *node-build
      target: scheduler
    env_file:
      - path: ${SEMFORGE_SCHEDULER_ENV_FILE:-deploy/env/scheduler.env}
        required: true
    environment:
      SEMFORGE_SERVICE: scheduler
    command: ["report-scheduler"]
    depends_on:
      release:
        condition: service_completed_successfully
    restart: "no"

  privacy:
    <<: *runtime
    profiles: [manual]
    image: ${SEMFORGE_PRIVACY_IMAGE:-semforge-privacy:local}
    build:
      <<: *node-build
      target: privacy
    env_file:
      - path: ${SEMFORGE_PRIVACY_ENV_FILE:-deploy/env/privacy.env}
        required: true
    environment:
      SEMFORGE_SERVICE: privacy
    depends_on:
      release:
        condition: service_completed_successfully
    restart: "no"

  privacy-request:
    <<: *runtime
    profiles: [manual]
    image: ${SEMFORGE_OPERATOR_IMAGE:-semforge-operator:local}
    build:
      <<: *node-build
      target: operator
    env_file:
      - path: ${SEMFORGE_OPERATOR_ENV_FILE:-deploy/env/operator.env}
        required: true
    environment:
      SEMFORGE_SERVICE: operator
    depends_on:
      release:
        condition: service_completed_successfully
    restart: "no"

  privacy-retention:
    <<: *runtime
    profiles: [scheduled]
    image: ${SEMFORGE_RETENTION_IMAGE:-semforge-retention:local}
    build:
      <<: *node-build
      target: retention
    env_file:
      - path: ${SEMFORGE_RETENTION_ENV_FILE:-deploy/env/retention.env}
        required: true
    environment:
      SEMFORGE_SERVICE: retention
    command: ["privacy-retention"]
    depends_on:
      release:
        condition: service_completed_successfully
    restart: "no"

networks:
  backend:
    driver: bridge
