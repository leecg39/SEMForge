# @TASK P4-O1-T1 - Run this one-shot migration job before web/worker rollout
apiVersion: batch/v1
kind: Job
metadata:
  name: semforge-release-REPLACE_WITH_VERSION
  labels:
    app.kubernetes.io/name: semforge
    app.kubernetes.io/component: release
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: semforge
        app.kubernetes.io/component: release
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.example.com/semforge-migrator@sha256:REPLACE_WITH_DIGEST
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: SEMFORGE_SERVICE
              value: migrate
            - name: PGSSLMODE
              value: verify-full
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: semforge-migration
                  key: database-url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
