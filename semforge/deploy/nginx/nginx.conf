# @TASK P4-O1-T1 - TLS and rate-limited reverse proxy example
# Replace certificate paths and upstream DNS before use. Do not expose Next directly.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
  limit_req_status 429;

  upstream semforge_web {
    server web:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name semforge.example.com;
    return 308 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name semforge.example.com;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Low accepted: 'unsafe-inline'은 현재 nonce middleware 없이 Next production inline bootstrap과
    # app CSS 호환을 유지하기 위한 임시 허용이다. 'unsafe-eval'은 production CSP에서 허용하지 않는다.
    # Google/NAVER/Toss server API는 browser가 직접 호출하지 않으므로 connect-src에 추가하지 않는다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.tosspayments.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; form-action 'self'; frame-src 'self' https://*.tosspayments.com; navigate-to 'self' https://accounts.google.com https://*.tosspayments.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;

    location ~ ^/api/v1/(auth|billing) {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://semforge_web;
      include /etc/nginx/conf.d/semforge-proxy-headers.conf;
    }

    location / {
      limit_req zone=general burst=40 nodelay;
      proxy_pass http://semforge_web;
      include /etc/nginx/conf.d/semforge-proxy-headers.conf;
    }
  }
}
