name: Release Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: semforge
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: semforge
          POSTGRES_PASSWORD: semforge
          POSTGRES_DB: semforge_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U semforge -d semforge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://semforge:semforge@localhost:5432/semforge_test
      CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      SEMFORGE_EXTERNAL_NETWORK: disabled
      SEMFORGE_RELEASE_DIFF_BASE: origin/codex/paid-beta-core
      SEMFORGE_NODE_BASE_IMAGE: node:24-bookworm-slim@sha256:3638d9a6fe4030bd716be989438248074489337ba3275657f93595428be4fc03
      SEMFORGE_POSTGRES_IMAGE: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: semforge/package-lock.json
      - name: Install Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          test -x "$CHROMIUM_EXECUTABLE_PATH"
      - name: Install dependencies
        run: npm ci
      - name: Release gate
        run: npm run ci:release-gate
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase5-ci-evidence
          path: semforge/.omo/evidence/phase5-ci/latest
